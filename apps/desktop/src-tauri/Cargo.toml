[package]
name = "openstream-desktop"
version.workspace = true
description = "StreamCraft desktop (Tauri 2)"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "openstream_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
openstream-core = { workspace = true }
openstream-ffmpeg = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }

open = "5"
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSObject", "NSDictionary", "NSURL"] }
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "WKUserContentController", "WKScriptMessage", "WKScriptMessageHandler", "WKFrameInfo", "WKUserScript", "WKWebViewConfiguration"] }
