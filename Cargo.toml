[workspace]
resolver = "2"
members = [
    "crates/streamcraft-core",
    "crates/streamcraft-cli",
    "crates/streamcraft-ffmpeg",
    "apps/streamcraft",
]
default-members = [
    "crates/streamcraft-core",
    "crates/streamcraft-cli",
    "crates/streamcraft-ffmpeg",
    "apps/streamcraft",
]

[workspace.package]
# Workspace version → streamcraft-app / CLI binaries (cargo). No secrets.
# 0.4.0: audit fixes, DASH, scheduler, Sync sheet, bundled + on-demand FFmpeg.
version = "0.4.0"
edition = "2024"
license = "MIT"
authors = ["StreamCraft contributors"]
repository = "https://github.com/ROSITO/StreamCraft"

# Single craft-libs pin for every storytold git dep (D021).
[workspace.dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "accesskit", "default_fonts", "clipboard", "wayland", "x11"] }
egui = { version = "0.37", features = ["default_fonts"] }
futures = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "gzip", "brotli", "deflate", "rustls-tls", "stream", "socks"] }
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
cap-std = "4"


craft-ai-core = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248", package = "craft-ai-core" }
craft-jsonrpc = { git = "https://github.com/storytold/craft-libs", rev = "a4db799563c9ccd7217e1731ec34c58f6ba57248", package = "craft-jsonrpc", features = ["async-lines"] }

streamcraft-core = { path = "crates/streamcraft-core" }
streamcraft-ffmpeg = { path = "crates/streamcraft-ffmpeg" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
