[workspace]
resolver = "2"
members = [
    "crates/streamcraft-core",
    "crates/streamcraft-cli",
    "crates/streamcraft-ffmpeg",
    "apps/desktop/src-tauri",
]
default-members = [
    "crates/streamcraft-core",
    "crates/streamcraft-cli",
    "crates/streamcraft-ffmpeg",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["StreamCraft contributors"]
repository = "https://github.com/ROSITO/StreamCraft"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures = "0.3"
quick-xml = { version = "0.37", features = ["serialize"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "gzip", "brotli", "deflate", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
streamcraft-core = { path = "crates/streamcraft-core" }
streamcraft-ffmpeg = { path = "crates/streamcraft-ffmpeg" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
