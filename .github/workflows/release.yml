name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev
      # Each package step fetches FFmpeg (SHA-256 verified), bundles it next to the
      # binaries and fails if the packaged binary can't resolve it on its own.
      - name: Package macOS app (FFmpeg bundled)
        if: runner.os == 'macOS'
        run: ./scripts/package-macos-app.sh dist/craft
      - name: Package Linux / Windows (FFmpeg bundled)
        if: runner.os != 'macOS'
        shell: bash
        run: ./scripts/package-craft-release.sh dist/craft
      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/craft/*.zip
            dist/craft/*.tar.gz
            dist/craft/streamcraft-macos-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
